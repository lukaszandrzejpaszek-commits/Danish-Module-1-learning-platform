<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Speaking tests</title></head>
<body>
<pre id="result">Running speaking tests...</pre>
<script type="module">
  import { isSpokenAnswerCorrect } from "../js/game.js";

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    assert(isSpokenAnswerCorrect("  SØNDAG. ", "søndag"), "Speech comparison should ignore case, spaces and final punctuation");
    assert(isSpokenAnswerCorrect("a\u030A", "å"), "Speech comparison should normalize Unicode");
    assert(isSpokenAnswerCorrect("grund til", "grund (til)") && isSpokenAnswerCorrect("grund", "grund (til)"), "Parenthesized vocabulary can be spoken with or without the parenthetical text");
    assert(isSpokenAnswerCorrect("grøntsag", "grøn(t)sag"), "Parenthesized letters should be accepted without punctuation");
    assert(isSpokenAnswerCorrect("der", "Der (fx ”der er…”)"), "Vocabulary examples should not be required in speech");
    assert(!isSpokenAnswerCorrect("søndog", "søndag"), "Different recognized words must not pass as typos");
    assert(!isSpokenAnswerCorrect("", ""), "Empty speech must not be accepted");
    document.querySelector("#result").textContent = "PASS";
  } catch (error) {
    document.querySelector("#result").textContent = `FAIL: ${error.message}`;
    throw error;
  }
</script>
</body>
</html>
